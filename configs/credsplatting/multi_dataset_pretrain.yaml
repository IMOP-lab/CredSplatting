  - name: nerf_train
    module: lib.datasets.nerf.credsplatting
    path: lib/datasets/nerf/credsplatting.py
    data_root: './datasets/nerf'
    split: 'train'
    input_h_w: [512, 640]
    input_ratio: 1.0
    sample_weight: 1.0
    

test_dataset:
  - name: dtu_test
    module: lib.datasets.dtu.credsplatting
    path: lib/datasets/dtu/credsplatting.py
    data_root: './datasets/dtu'
    ann_file: 'data/credsplatting/dtu_val_all.txt'
    split: 'test'
    input_ratio: 1.0
    sample_weight: 1.0

# test_dataset:
#   - name: blendedmvs_test
