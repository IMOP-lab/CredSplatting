#     split: 'test'
#     input_h_w: [512, 640]
#     input_ratio: 1.0
#     sample_weight: 1.0

train:
    batch_size: 1
    lr: 5e-4
    weight_decay: 0.
    epoch: 300
    scheduler:
        type: 'exponential'
        gamma: 0.5
        decay_epochs: 50
    batch_sampler: 'credsplatting'
    collator: 'credsplatting'
    sampler_meta:
        input_views_num: [2, 3, 4, 5]
        input_views_prob: [0.1, 0.8, 0.1, 0.0]
    num_workers: 1

test:
    batch_size: 1
    collator: 'credsplatting'
    batch_sampler: 'credsplatting'
    sampler_meta:
        input_views_num: [3]
        input_views_prob: [1.]

ep_iter: 1000
save_ep: 1
eval_ep: 1
save_latest_ep: 1
log_interval: 1

