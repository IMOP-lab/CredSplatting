task: credsplatting
gpus: [0]
exp_name: 'dtu_pretrain_train4'

# module
# train_dataset_module: [lib.datasets.dtu.credsplatting, lib.datasets.tnt.credsplatting]
# test_dataset_module: lib.datasets.dtu.credsplatting
network_module: lib.networks.credsplatting.network
loss_module: lib.train.losses.credsplatting
evaluator_module: lib.evaluators.credsplatting
# evaluator_module: lib.evaluators.mvsgs_save_depth2

save_result: True
eval_lpips: True
save_video: False
save_ply: False
dir_ply: 'credsplatting_pointcloud'
distributed: True

# task config
credsplatting:
    train_input_views: [2, 3, 4, 5]
    train_input_views_prob: [0.1, 0.8, 0.1, 0.0]
    test_input_views: 3
    scale_factor: 1
    viewdir_agg: True
    chunk_size: 1000000
    eval_depth: False
    eval_center: False
    reweighting: True
    bg_color: [0, 0, 0]
    fineturn: false
    cas_config:
        num: 2
        depth_inv: [True, False]
        volume_scale: [0.125, 0.5]
        volume_planes: [64, 8]
        im_feat_scale: [0.25, 0.5]
        im_ibr_scale: [0.25, 1.]
        render_scale: [0.25, 1.0]
        render_im_feat_level: [0, 2]
        gs_model_feat_ch: [32, 8]
        render_if: [True, True]
        num_samples: [1, 1]
        num_rays: [4096, 32768]
        num_patchs: [0, 0]
        train_img: [True, True]
        patch_size: [-1, -1]
        loss_weight: [0.5, 1.]



