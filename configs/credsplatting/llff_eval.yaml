parent_cfg: configs/credsplatting/multi_dataset_pretrain.yaml

# train_dataset_module: lib.datasets.llff.credsplatting
# test_dataset_module: lib.datasets.llff.credsplatting

credsplatting:
    eval_center: True
    reweighting: False
    scale_factor: 12
    test_input_views: 3
    cas_config:
        render_if: [False, True]
        volume_planes: [16, 8]

train_dataset:
  - name: llff_train
    module: lib.datasets.llff.credsplatting
    path: lib/datasets/llff/credsplatting.py
    data_root: './datasets/llff'
    split: 'train'
    input_h_w: [640, 960]
    input_ratio: 1.
    sample_weight: 1.0

test_dataset:
  - name: llff_test
    module: lib.datasets.llff.credsplatting
    path: lib/datasets/llff/credsplatting.py
    data_root: './datasets/llff'
    split: 'test'
    input_h_w: [640, 960]
    input_ratio: 1.0
    sample_weight: 1.0
